  };
function report(ok, info) {

  window.__exports__.apply(ctx); // 无 betterSidebar → 3s 后降级独立面板

    if (done) { clearInterval(timer); return; }
    const host = document.querySelector('[data-github-workbench-host]');
    const styleOk = !!document.getElementById('github-workbench-styles');
    const txt = host ? host.innerText || '' : '';
    if (host && styleOk && txt.indexOf('选择仓库') >= 0) {
      done = true; clearInterval(timer);
      report(true, 'standalone mounted; styles injected; SetupCard rendered');
    }
  }, 150);
  setTimeout(() => { if (!done) { done = true; clearInterval(timer);
    const h = !!document.querySelector('[data-github-workbench-host]');
    report(false, 'timeout; host=' + h + '; styles=' + !!document.getElementById('github-workbench-styles')); } }, 9000);
} catch (e) { report(false, 'exception ' + e.message); }
</script>
