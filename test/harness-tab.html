           JSON.parse(info).toggles === 2 && JSON.parse(info).iconFn &&
           JSON.parse(info).comp === 'WorkbenchApp' && JSON.parse(info).sid === 's1', info);
  }
} catch (e) { report(false, 'exception ' + e.message); }
